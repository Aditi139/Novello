# Railway injects a $PORT env var and healthchecks on that port.
# Use ${PORT} here — the official nginx:alpine image automatically
# runs envsubst on files placed in /etc/nginx/templates/, so ${PORT}
# is replaced at container start with the actual port Railway assigned.

server {
    listen ${PORT};

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Cache static assets ───────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # ── NOTE ──────────────────────────────────────────────────────────────────
    # The API proxy block (proxy_pass http://api-gateway:8080) is intentionally
    # removed. On Railway there is no shared Docker network, so nginx cannot
    # resolve "api-gateway". The frontend JS calls the API Gateway directly via
    # the HTTPS URL injected at build time as VITE_API_URL.
}
