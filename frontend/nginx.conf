server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── React SPA routing ─────────────────────────────────────────────────────
    # All routes fall back to index.html so React Router handles navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Cache static assets ───────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # NOTE: On Railway the frontend calls the API Gateway directly via HTTPS
    # (VITE_API_URL build arg → baked into the JS bundle at compile time).
    # The docker-compose proxy block (proxy_pass http://api-gateway:8080)
    # has been intentionally removed — it only works inside Docker Compose
    # networking and causes a crash when nginx can't resolve "api-gateway".
}
