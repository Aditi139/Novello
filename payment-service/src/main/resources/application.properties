# Railway injects PORT at runtime; fall back to SERVER_PORT for local dev
server.port=${PORT:${SERVER_PORT:8084}}
spring.application.name=payment-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/novello_payments?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Razorpay Configuration
# Get test keys from: https://dashboard.razorpay.com/app/keys
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_YourKeyIdHere}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:YourKeySecretHere}

order.service.url=${ORDER_SERVICE_URL:http://localhost:8083}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8087}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
