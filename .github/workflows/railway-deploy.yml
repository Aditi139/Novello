name: 🚀 Deploy to Railway

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (leave empty to deploy all)'
        required: false
        default: 'all'

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  # ── Deploy Backend Services ───────────────────────────────────────────────────
  deploy-mysql:
    name: 🗄️ MySQL (skip if already running)
    runs-on: ubuntu-latest
    if: github.event.inputs.service == 'all' || github.event.inputs.service == 'mysql' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest
      - name: Deploy MySQL
        run: |
          railway redeploy --service mysql --yes
        continue-on-error: true   # MySQL might not need redeploying every push

  deploy-redis:
    name: ⚡ Redis (skip if already running)
    runs-on: ubuntu-latest
    if: github.event.inputs.service == 'all' || github.event.inputs.service == 'redis' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest
      - name: Deploy Redis
        run: |
          railway redeploy --service redis --yes
        continue-on-error: true

  deploy-user-service:
    name: 👤 User Service
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.service == 'all' ||
      github.event.inputs.service == 'user-service' ||
      (github.event_name == 'push' && contains(github.event.head_commit.modified, 'user-service/'))
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest
      - name: Deploy User Service
        working-directory: user-service
        run: railway up --service user-service --detach

  deploy-catalog-service:
    name: 📚 Catalog Service
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.service == 'all' ||
      github.event.inputs.service == 'catalog-service' ||
      (github.event_name == 'push' && contains(github.event.head_commit.modified, 'catalog-service/'))
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest
      - name: Deploy Catalog Service
        working-directory: catalog-service
        run: railway up --service catalog-service --detach

  deploy-order-service:
    name: 📦 Order Service
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.service == 'all' ||
      github.event.inputs.service == 'order-service' ||
      (github.event_name == 'push' && contains(github.event.head_commit.modified, 'order-service/'))
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest
      - name: Deploy Order Service
        working-directory: order-service
        run: railway up --service order-service --detach

  deploy-payment-service:
    name: 💳 Payment Service
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.service == 'all' ||
      github.event.inputs.service == 'payment-service' ||
      (github.event_name == 'push' && contains(github.event.head_commit.modified, 'payment-service/'))
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest
      - name: Deploy Payment Service
        working-directory: payment-service
        run: railway up --service payment-service --detach

  deploy-inventory-service:
    name: 📊 Inventory Service
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.service == 'all' ||
      github.event.inputs.service == 'inventory-service' ||
      (github.event_name == 'push' && contains(github.event.head_commit.modified, 'inventory-service/'))
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest
      - name: Deploy Inventory Service
        working-directory: inventory-service
        run: railway up --service inventory-service --detach

  deploy-ebook-service:
    name: 📱 eBook Service
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.service == 'all' ||
      github.event.inputs.service == 'ebook-service' ||
      (github.event_name == 'push' && contains(github.event.head_commit.modified, 'ebook-service/'))
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest
      - name: Deploy eBook Service
        working-directory: ebook-service
        run: railway up --service ebook-service --detach

  deploy-notification-service:
    name: 🔔 Notification Service
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.service == 'all' ||
      github.event.inputs.service == 'notification-service' ||
      (github.event_name == 'push' && contains(github.event.head_commit.modified, 'notification-service/'))
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest
      - name: Deploy Notification Service
        working-directory: notification-service
        run: railway up --service notification-service --detach

  deploy-api-gateway:
    name: 🌐 API Gateway
    runs-on: ubuntu-latest
    needs:
      - deploy-user-service
      - deploy-catalog-service
      - deploy-order-service
    if: |
      always() && (
        github.event.inputs.service == 'all' ||
        github.event.inputs.service == 'api-gateway' ||
        (github.event_name == 'push' && contains(github.event.head_commit.modified, 'api-gateway/'))
      )
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest
      - name: Deploy API Gateway
        working-directory: api-gateway
        run: railway up --service api-gateway --detach

  # ── Deploy Frontend (last — depends on API Gateway being live) ────────────────
  deploy-frontend:
    name: 🎨 Frontend
    runs-on: ubuntu-latest
    needs: [ deploy-api-gateway ]
    if: |
      always() && (
        github.event.inputs.service == 'all' ||
        github.event.inputs.service == 'frontend' ||
        (github.event_name == 'push' && contains(github.event.head_commit.modified, 'frontend/'))
      )
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest
      - name: Deploy Frontend
        working-directory: frontend
        run: railway up --service frontend --detach

  # ── Health Check Summary ──────────────────────────────────────────────────────
  verify:
    name: ✅ Verify Deployment
    runs-on: ubuntu-latest
    needs:
      - deploy-api-gateway
      - deploy-frontend
    if: always()
    steps:
      - name: Wait for services to start
        run: sleep 60

      - name: Health check — API Gateway
        run: |
          curl -f --retry 5 --retry-delay 10 \
            "${{ secrets.RAILWAY_API_GATEWAY_URL }}/actuator/health" \
            && echo "✅ API Gateway healthy" \
            || echo "⚠️  API Gateway health check failed (may still be starting)"
        continue-on-error: true

      - name: Health check — Catalog API
        run: |
          curl -f --retry 3 --retry-delay 10 \
            "${{ secrets.RAILWAY_API_GATEWAY_URL }}/api/books?page=0&size=3" \
            && echo "✅ Catalog API responding" \
            || echo "⚠️  Catalog API not yet available"
        continue-on-error: true

      - name: Summary
        run: |
          echo "🚀 Deployment triggered for all services"
          echo "📋 Check Railway dashboard for build logs:"
          echo "   https://railway.app/dashboard"
          echo ""
          echo "🌐 API Gateway: ${{ secrets.RAILWAY_API_GATEWAY_URL }}"
          echo "🎨 Frontend:    ${{ secrets.RAILWAY_FRONTEND_URL }}"
